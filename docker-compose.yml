name: galant2
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: galant
      POSTGRES_USER: galant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galant -d galant"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [private]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  api:
    build: {context: ., dockerfile: apps/backend/Dockerfile}
    restart: unless-stopped
    environment: &env
      APP_SECRET: ${APP_SECRET:?Configure APP_SECRET}
      DATABASE_URL: postgresql+psycopg://galant:${POSTGRES_PASSWORD}@db:5432/galant
      DOCUMENT_DIR: /data/documents
      OCR_LANG: ${OCR_LANG:-spa+eng}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-50}
    volumes: ["./storage:/data/documents"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 6
      start_period: 30s
    networks: [private]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 150
    mem_limit: 650m
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  worker:
    build: {context: ., dockerfile: apps/backend/Dockerfile}
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment: *env
    volumes: ["./storage:/data/documents"]
    depends_on: {db: {condition: service_healthy}}
    networks: [private]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 150
    mem_limit: 1100m
    cpus: 1.5
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  frontend:
    build: {context: ., dockerfile: apps/frontend/Dockerfile}
    restart: unless-stopped
    depends_on: [api]
    networks: [private]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      GALANT_SITE: ${GALANT_SITE:-:80}
    ports: ["80:80","443:443","443:443/udp"]
    volumes:
      - ./infrastructure/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend,api]
    networks: [private,public]
    security_opt: [no-new-privileges:true]
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
networks:
  private: {internal: true}
  public: {}
volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
