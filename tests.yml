name: GALANT - pruebas de auditoria documental

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verificar sintaxis
        run: python -m compileall -q app.py auditoria_laboral.py f301_lector.py f301_nomina_reforzada.py cruce_documental_galant.py previred_pdf.py previred_scan_fast.py test_galant_revision.py
      - name: Ejecutar pruebas de lógica y de aplicación
        run: python -m pytest -q
