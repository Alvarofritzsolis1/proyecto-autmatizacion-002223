name: GALANT - rescate OCR de planillas y segundo motor
on:
  push:
    branches: [fix/galant-rescate-tablas-on-demand-20261029, main]
    paths:
      - 'app.py'
      - 'fonasa_runtime.py'
      - 'fonasa_nomina_simple.py'
      - 'fonasa_validacion.py'
      - 'nomina_salud.py'
      - 'rescate_planillas.py'
      - 'ocr_alternativo_nomina.py'
      - 'tests/test_rescate_planillas.py'
      - 'tests/test_ocr_alternativo_nomina.py'
      - '.github/workflows/galant-rescate-ci.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'fonasa_runtime.py'
      - 'fonasa_nomina_simple.py'
      - 'rescate_planillas.py'
      - 'ocr_alternativo_nomina.py'
permissions:
  contents: read
jobs:
  rescate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pytest
      - name: Compilacion de modulos
        run: python -m compileall -q app.py fonasa_runtime.py fonasa_nomina_simple.py fonasa_validacion.py nomina_salud.py rescate_planillas.py ocr_alternativo_nomina.py
      - name: OCR alternativo, rescate y regresiones previas
        run: |
          python -m pytest -q \
            tests/test_rescate_planillas.py \
            tests/test_ocr_alternativo_nomina.py \
            tests/test_fonasa_runtime.py \
            tests/test_fonasa_nomina_simple.py \
            tests/test_fonasa_dias_robustos.py \
            tests/test_fonasa_trazabilidad.py \
            tests/test_nomina_salud.py \
            tests/test_streamlit_fonasa_cache.py
