name: GALANT Cloud Run + Vision - validacion
on:
  push:
    branches:
      - feature/galant-cloudrun-vision
  pull_request:
    paths:
      - 'cloudrun/**'
      - 'worker/**'
      - 'supabase/migrations/20261029_galant_vision_budget.sql'
      - 'tests/test_vision_rescue.py'
      - 'Dockerfile'
      - '.github/workflows/galant-cloudrun-check.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependencias de OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.txt pytest
      - name: Sintaxis Python
        run: python -m compileall -q worker pago_documental.py f301_lector.py
      - name: Tests OCR seguro y sin API de pago
        run: python -m pytest -q tests/test_vision_rescue.py tests/test_pago_documental.py
      - name: Comprobar script instalador
        run: bash -n cloudrun/instalar_desde_cloud_shell.sh
      - name: Compilar contenedor
        run: docker build --tag galant-ocr:ci .
