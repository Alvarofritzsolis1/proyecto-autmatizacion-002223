name: GALANT - nómina salud Fonasa e Isapres y Excel
on:
  push:
    branches: [feature/galant-nomina-salud-excel-20261029, main]
    paths:
      - 'app.py'
      - 'fonasa_nomina_simple.py'
      - 'fonasa_runtime.py'
      - 'nomina_salud.py'
      - 'reporte_nomina_excel.py'
      - 'pago_documental.py'
      - 'tests/test_nomina_salud.py'
      - 'tests/test_isapre_planilla.py'
      - 'tests/test_reporte_nomina_excel.py'
      - 'tests/test_streamlit_fonasa_cache.py'
      - '.github/workflows/galant-nomina-salud-ci.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'fonasa_nomina_simple.py'
      - 'nomina_salud.py'
      - 'reporte_nomina_excel.py'
      - 'pago_documental.py'
permissions:
  contents: read
jobs:
  salud-excel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Dependencias OCR de CPU
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - name: Instalar app y pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compilación de la aplicación y lectores
        run: python -m compileall -q app.py planillas_texto_digital.py fonasa_nomina_simple.py fonasa_runtime.py nomina_salud.py reporte_nomina_excel.py pago_documental.py
      - name: Fonasa, Isapres, consolidación y Excel
        run: |
          python -m pytest -q \
            tests/test_planillas_texto_digital.py \
            tests/test_isapre_planilla.py \
            tests/test_nomina_salud.py \
            tests/test_reporte_nomina_excel.py \
            tests/test_streamlit_fonasa_cache.py \
            tests/test_fonasa_nomina_simple.py \
            tests/test_fonasa_dias_robustos.py \
            tests/test_fonasa_trazabilidad.py \
            tests/test_fonasa_runtime.py \
            tests/test_pago_documental.py
