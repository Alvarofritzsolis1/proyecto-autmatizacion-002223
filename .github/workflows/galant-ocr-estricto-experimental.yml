name: GALANT · ensayo OCR estricto (NO producción)
on:
  push:
    branches:
      - experiment/galant-ocr-control-estricto-90d-20261030
  pull_request:
    paths:
      - 'ocr_control_estricto.py'
      - 'fonasa_nomina_simple.py'
      - 'tests/test_ocr_control_estricto.py'
      - 'scripts/validar_corpus_privado.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocr-estricto-sintetico:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Obtener codigo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Herramientas locales OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - name: Instalacion de dependencias
        run: python -m pip install -r requirements.txt pytest
      - name: Validar sintaxis
        run: python -m compileall -q ocr_control_estricto.py fonasa_nomina_simple.py scripts/validar_corpus_privado.py
      - name: 120 casos de OCR real sobre numeros sinteticos y regresiones
        env:
          GALANT_OCR_STRICT_MODE: '0'
        run: |
          python -m pytest -q \
            tests/test_ocr_control_estricto.py \
            tests/test_fonasa_dias_robustos.py \
            tests/test_fonasa_nomina_simple.py \
            tests/test_fonasa_trazabilidad.py \
            tests/test_fonasa_runtime.py \
            tests/test_nomina_salud.py
      - name: Garantizar que NO se ha probado corpus privado en GitHub
        run: |
          echo "RESULTADO LIMITADO: pruebas sinteticas/funcionales; "
          echo "la validacion de PDF privados requiere su manifest fuera de GitHub."
