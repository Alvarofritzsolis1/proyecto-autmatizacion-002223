name: GALANT - regresion 20 celdas Fonasa
on:
  push:
    branches: [fix/galant-fonasa-dias-11-27-20261029, fix/galant-invalidar-cache-fonasa-v1862, fix/galant-fonasa-trazabilidad-real-20261029, main]
    paths:
      - 'fonasa_nomina_simple.py'
      - 'app.py'
      - 'tests/test_fonasa_dias_robustos.py'
      - 'tests/test_streamlit_fonasa_cache.py'
      - 'fonasa_validacion.py'
      - 'tests/test_fonasa_trazabilidad.py'
      - '.github/workflows/galant-fonasa-dias-ci.yml'
  pull_request:
    paths:
      - 'fonasa_nomina_simple.py'
      - 'tests/test_fonasa_dias_robustos.py'
permissions:
  contents: read
jobs:
  fonasa-days:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - name: Install project requirements
        run: python -m pip install -r requirements.txt pytest
      - name: Validate syntax
        run: python -m compileall -q fonasa_nomina_simple.py tests/test_fonasa_dias_robustos.py
      - name: 20 OCR cases + original Fonasa regression suite
        run: python -m pytest -q tests/test_fonasa_dias_robustos.py tests/test_fonasa_nomina_simple.py tests/test_streamlit_fonasa_cache.py
