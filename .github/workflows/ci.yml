name: GALANT 2.0 - Integración continua
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app alembic
      - run: OCR_LANG=eng python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run build
