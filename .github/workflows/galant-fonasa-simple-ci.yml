name: GALANT Streamlit - pago y nómina Fonasa simplificados
on:
  push:
    branches: [fix/galant-fonasa-trabajadores-simple]
  pull_request:
    paths:
      - 'fonasa_nomina_simple.py'
      - 'app.py'
      - 'pago_documental.py'
      - 'tests/test_fonasa_nomina_simple.py'
      - '.github/workflows/galant-fonasa-simple-ci.yml'
permissions:
  contents: read
jobs:
  fonasa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: OCR local de Fonasa
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Validar sintaxis
        run: python -m compileall -q fonasa_nomina_simple.py app.py pago_documental.py
      - name: Validar nómina Fonasa y pago documental
        run: python -m pytest -q tests/test_fonasa_nomina_simple.py tests/test_pago_documental.py tests/test_rapidocr_pago.py
